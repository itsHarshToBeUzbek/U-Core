<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Приёмка — U-Core</title>
<style>
  :root {
    --brand: #7000ff; --brand-soft: #f3ecff; --brand-deep: #5a00cc;
    --ink: #14121a; --ink-soft: #4a4658; --ink-faint: #8a8598;
    --line: #e6e2ee; --paper: #ffffff; --ground: #f7f5fb;
    --good: #067647; --good-soft: #e7f6ee;
    --warn: #b45309; --warn-soft: #fdf3e7;
    --bad: #b42318; --bad-soft: #fdeceb;
    --font: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #a97cff; --brand-soft: #241a38; --brand-deep: #c4a5ff;
      --ink: #f2f0f7; --ink-soft: #b8b3c6; --ink-faint: #837d94;
      --line: #2e2940; --paper: #191527; --ground: #110e1c;
      --good: #4ade80; --good-soft: #12301f;
      --warn: #fbbf24; --warn-soft: #33260c;
      --bad: #fca5a5; --bad-soft: #3a1614;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font); font-size: 14px; line-height: 1.45;
  }

  /* ---------- шапка ---------- */
  header {
    position: sticky; top: 0; z-index: 20; background: var(--paper);
    border-bottom: 1px solid var(--line); padding: 14px 20px 0;
  }
  .head-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .head-spacer { margin-left: auto; }

  /* Большая, звучная кнопка — оператор должен видеть её через весь зал. */
  .big-action {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--brand), #9b4dff);
    color: #fff; border: none; border-radius: 14px;
    padding: 14px 26px; font-family: var(--font);
    font-size: 17px; font-weight: 800; letter-spacing: 0.01em;
    cursor: pointer; box-shadow: 0 4px 14px rgba(112, 0, 255, 0.35);
    transition: transform .08s ease, box-shadow .15s ease;
  }
  .big-action:hover { box-shadow: 0 6px 20px rgba(112, 0, 255, 0.45); }
  .big-action:active { transform: translateY(1px); }
  .big-action[disabled] { opacity: .45; cursor: default; box-shadow: none; }
  .big-action--ghost {
    background: var(--paper); color: var(--brand);
    border: 2px solid var(--brand); box-shadow: none;
  }
  .big-action--stop { background: linear-gradient(135deg, #b42318, #d9483b); box-shadow: none; }

  .btn {
    background: var(--paper); color: var(--ink); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 14px; font-family: var(--font);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-deep); }

  .stats { display: flex; gap: 22px; padding: 12px 0 14px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; }
  .stat[data-state="warn"] b { color: var(--warn); }
  .stat[data-state="ok"] b { color: var(--good); }

  .filters { display: flex; gap: 10px; align-items: center; padding-bottom: 14px; flex-wrap: wrap; }
  input[type="search"], select {
    font-family: var(--font); font-size: 14px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--paper); color: var(--ink); min-width: 200px;
  }
  input[type="search"]:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }

  /* ---------- полоса приёмки ---------- */
  .run {
    display: none; align-items: center; gap: 18px;
    background: var(--brand-soft); border: 2px solid var(--brand);
    border-radius: 14px; margin: 0 20px 16px; padding: 16px 20px;
  }
  .run[data-on="1"] { display: flex; }
  .run__cell {
    font-family: var(--font-mono); font-size: 46px; font-weight: 800;
    color: var(--brand-deep); line-height: 1; letter-spacing: .02em;
  }
  .run__meta { flex: 1; min-width: 0; }
  .run__name { font-size: 16px; font-weight: 700; }
  .run__sub { font-size: 12px; color: var(--ink-soft); font-family: var(--font-mono); margin-top: 2px; }
  .run__count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }

  /* ---------- таблица ---------- */
  main { padding: 0 20px 40px; }
  .wrap { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  th {
    position: sticky; top: 0; background: var(--paper); z-index: 5;
    text-align: left; padding: 11px 12px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint);
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--brand-soft); }
  tbody tr[data-done="1"] td { opacity: .45; }
  tbody tr[data-gone="1"] td { opacity: .5; text-decoration: line-through; }
  .c-cell {
    font-family: var(--font-mono); font-weight: 800; font-size: 15px;
    color: var(--brand-deep); white-space: nowrap;
  }
  .c-mono { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
  .c-name { max-width: 380px; }
  .c-name small { display: block; color: var(--ink-faint); font-size: 11px; }
  .muted { color: var(--ink-faint); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; background: var(--ground); color: var(--ink-soft);
  }
  .badge[data-src="fbo"] { background: var(--brand-soft); color: var(--brand-deep); }
  .badge[data-src="cargo"] { background: var(--warn-soft); color: var(--warn); }
  .badge[data-src="partner"] { background: var(--good-soft); color: var(--good); }
  .flag {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px;
    background: #b45309; color: #fff; font-size: 10px; font-weight: 700; font-family: var(--font-mono);
  }
  .rec { font-family: var(--font-mono); font-weight: 700; color: var(--good); }
  .row-btn {
    background: none; border: 1px solid var(--line); border-radius: 7px;
    padding: 4px 9px; font-size: 11px; cursor: pointer; color: var(--ink-soft);
    font-family: var(--font); white-space: nowrap;
  }
  .row-btn:hover { border-color: var(--bad); color: var(--bad); }

  .empty { padding: 60px 20px; text-align: center; color: var(--ink-faint); }
  .note {
    margin: 0 20px 14px; padding: 12px 16px; border-radius: 10px;
    background: var(--warn-soft); color: var(--warn); font-size: 13px; display: none;
  }
  .note[data-on="1"] { display: block; }

  .foot { padding: 14px 20px 0; font-size: 12px; color: var(--ink-faint); }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>Приёмка</h1>
    <button id="btn-start" class="big-action">▶ Начать приёмку</button>
    <button id="btn-next" class="big-action" style="display:none">Дальше →</button>
    <button id="btn-stop" class="big-action big-action--stop" style="display:none">Закончить</button>
    <div class="head-spacer"></div>
    <button id="btn-sound" class="btn" aria-pressed="true">🔊 Звук</button>
    <button id="btn-sync" class="btn">Обновить данные</button>
    <button id="btn-export" class="btn">Выгрузить CSV</button>
    <button id="btn-inv" class="btn">Инвентаризация →</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>на полке</span></div>
    <div class="stat" data-state="ok"><b id="s-cell">0</b><span>с ячейкой</span></div>
    <div class="stat" data-state="warn"><b id="s-nocell">0</b><span>без ячейки</span></div>
    <div class="stat"><b id="s-cells">0</b><span>занятых ячеек</span></div>
    <div class="stat"><b id="s-gm">0</b><span>грузомест</span></div>
    <div class="stat"><b id="s-incoming">0</b><span>едет в коробах</span></div>
    <div class="stat"><b id="s-gone">0</b><span>выдано/убыло</span></div>
    <div class="stat"><b id="s-named">0</b><span>с названием</span></div>
  </div>

  <div class="filters">
    <input type="search" id="q" placeholder="Поиск: ячейка, заказ, PID, ШК, клиент, товар">
    <select id="src"><option value="">Все источники</option></select>
    <select id="mode">
      <option value="all">Показывать всё</option>
      <option value="cell">Только с ячейкой</option>
      <option value="nocell">Только без ячейки (на полке)</option>
      <option value="incoming">Только в коробах (к приёмке)</option>
      <option value="named">Только с названием</option>
      <option value="unnamed">Только без названия</option>
      <option value="gone">Только выданные/убывшие</option>
    </select>
    <span id="shown" class="muted"></span>
  </div>
</header>

<div class="note" id="note"></div>

<div class="run" id="run">
  <div class="run__cell" id="run-cell">—</div>
  <div class="run__meta">
    <div class="run__name" id="run-name">—</div>
    <div class="run__sub" id="run-sub">—</div>
  </div>
  <div class="run__count" id="run-count"></div>
  <button id="run-repeat" class="big-action big-action--ghost">🔁 Повторить</button>
</div>

<main>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Ячейка</th>
          <th id="th-rec" style="display:none">Рекомендация</th>
          <th>Заказ</th>
          <th>PID</th>
          <th>ШК товара</th>
          <th>Товар</th>
          <th>Клиент</th>
          <th>ГМ</th>
          <th>Источник</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">Данных пока нет. Нажмите «Обновить данные».</div>
  </div>
  <div class="foot" id="foot"></div>
</main>

<script src="wms-parse.js"></script>
<script src="priemka.js" type="module"></script>
</body>
</html>
